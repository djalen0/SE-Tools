<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ show.name }} - Tour Report</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#4f46e5">
<script>
(function () {
  try {
    var KEY = 'pa-pinner-theme-dark';
    var stored = localStorage.getItem(KEY);
    var dark = stored === null ? window.matchMedia('(prefers-color-scheme: dark)').matches : stored === '1';
    document.documentElement.classList.toggle('theme-dark', dark);
    if (dark) document.querySelector('meta[name=theme-color]').setAttribute('content', '#14151c');
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-show-slug="{{ show.slug }}" class="report-page">
<header class="page-topbar">
  <nav class="breadcrumb">
    <a href="/">Home</a>
    <span class="crumb-sep">/</span>
    <a href="/{{ show.slug }}">{{ show.name }}</a>
    <span class="crumb-sep">/</span>
    <span class="crumb-current">Tour Report</span>
  </nav>
  <button id="themeToggleBtn" class="btn btn-ghost theme-toggle-btn" type="button"></button>
</header>
<div class="page-content report-content">
  <div class="report-head">
    <div>
      <h1>{{ show.name }} &mdash; Tour Report</h1>
      <p class="page-sub" id="reportSub">Box-by-box angles across the tour.</p>
    </div>
    <div class="report-actions">
      <button id="exportCsvBtn" class="btn btn-ghost" type="button">Export CSV</button>
      <button id="printReportBtn" class="btn btn-primary" type="button">Print / Save PDF</button>
    </div>
  </div>

  <div class="report-filters">
    <div class="report-filters-row">
      <div class="report-seg" id="hangTabs" role="tablist" aria-label="Hang"></div>
      <details class="report-date-picker" id="datePicker">
        <summary id="datePickerSummary">Dates</summary>
        <div class="report-date-list" id="dateCheckList"></div>
      </details>
    </div>
    <div class="report-filters-row report-filters-options">
      <div id="sizeFilter" class="report-field"></div>
      <div id="alignToggle" class="report-field"></div>
    </div>
    <p id="filterHint" class="report-filter-hint" hidden></p>
  </div>

  <div id="reportBody"></div>
</div>
<div id="reportTooltip" class="report-tooltip" hidden></div>

<script src="{{ url_for('static', filename='theme.js') }}"></script>
<script src="{{ url_for('static', filename='report.js') }}"></script>
</body>
</html>
